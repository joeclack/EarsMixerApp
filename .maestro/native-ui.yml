appId: com.joeclack.earsmixerapp
---
- launchApp:
    clearState: true
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Finish"
- extendedWaitUntil:
    visible: "Select a server or enter its address."
    timeout: 30000
- takeScreenshot: screenshots/ios-connect-sheet
- tapOn:
    text: "Allow"
    optional: true
- tapOn: "Manual"
- scrollUntilVisible:
    element:
      id: mixer-address
    direction: DOWN
- tapOn:
    id: mixer-address
- inputText: "http://127.0.0.1:8082"
- hideKeyboard
- tapOn:
    id: action-connect
- extendedWaitUntil:
    visible: "Kick"
    timeout: 30000
- takeScreenshot: screenshots/ios-mixer
- tapOn: "Settings"
- assertVisible: "This device"
- assertVisible: "Compact channels"
- takeScreenshot: screenshots/ios-settings
