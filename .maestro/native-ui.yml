appId: com.joeclack.earsmixerapp
---
# Setup requires a nickname before Next is enabled. After a name is entered the
# first-step CTA becomes "Hi, <name>"; later steps use Next, then Finish.
- launchApp:
    clearState: true
- tapOn: "Nickname"
- inputText: "Test"
- hideKeyboard
- tapOn:
    text: "Hi, Test"
    enabled: true
- tapOn:
    text: "Next"
    enabled: true
- tapOn:
    text: "Next"
    enabled: true
- tapOn:
    text: "Next"
    enabled: true
- tapOn:
    text: "Next"
    enabled: true
- tapOn:
    text: "Finish"
    enabled: true
- extendedWaitUntil:
    visible: "Select a server or enter its address."
    timeout: 30000
- takeScreenshot: screenshots/ios-connect-sheet
- tapOn:
    text: "Allow"
    optional: true
- tapOn: "Manual"
- scrollUntilVisible:
    element:
      id: mixer-address
    direction: DOWN
- tapOn:
    id: mixer-address
- inputText: "http://127.0.0.1:8082"
- hideKeyboard
- tapOn:
    id: action-connect
- extendedWaitUntil:
    visible: "Kick"
    timeout: 30000
- takeScreenshot: screenshots/ios-mixer
- tapOn: "Settings"
- assertVisible: "This device"
- assertVisible: "Edit channels"
- takeScreenshot: screenshots/ios-settings
