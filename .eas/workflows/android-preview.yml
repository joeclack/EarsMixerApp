name: Publish Android preview to Cloudflare R2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_commit:
        type: string
        required: true
        description: Current main commit with a completed Android preview build

concurrency:
  group: android-preview-main

jobs:
  build_android:
    name: Build signed Android preview APK
    if: ${{ github.event_name == 'push' }}
    type: build
    params:
      platform: android
      profile: preview

  reuse_android:
    name: Find the completed Android preview APK
    if: ${{ github.event_name == 'workflow_dispatch' }}
    type: get-build
    params:
      platform: android
      profile: preview
      distribution: internal
      git_commit_hash: ${{ inputs.release_commit }}

  publish_android:
    name: Publish Android APK and download manifest
    after: [build_android, reuse_android]
    if: ${{ (github.event_name == 'push' && after.build_android.status == 'success') || (github.event_name == 'workflow_dispatch' && after.reuse_android.status == 'success') }}
    environment: preview
    env:
      R2_BUCKET: earsmixer-downloads
      R2_S3_ENDPOINT: https://db1eae667ba994762bf18486c2846be1.r2.cloudflarestorage.com
      APK_BUILD_ID: ${{ after.build_android.outputs.build_id || after.reuse_android.outputs.build_id }}
      APK_VERSION: ${{ after.build_android.outputs.app_version || after.reuse_android.outputs.app_version }}
      APK_VERSION_CODE: ${{ after.build_android.outputs.app_build_version || after.reuse_android.outputs.app_build_version }}
      APK_COMMIT: ${{ after.build_android.outputs.git_commit_hash || after.reuse_android.outputs.git_commit_hash }}
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: apk
        with:
          build_id: ${{ env.APK_BUILD_ID }}
          extensions: [apk]
      - name: Upload APK to R2 and update the public download
        run: bash scripts/publish-android-preview.sh '${{ steps.apk.outputs.artifact_path }}'
